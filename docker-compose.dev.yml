# Whiteboard — dev compose.
#
# Runs the full stack inside a Bun container with bind-mounted source.
# Use this when you want production-parity dev without installing Bun on the host,
# or to validate that the Dockerized stack works before shipping.
#
# For everyday host-based dev, prefer:
#   bun run dev
#
# Usage:
#   docker compose -f docker-compose.dev.yml up

services:
  whiteboard-dev:
    image: oven/bun:1.3-slim
    container_name: whiteboard-dev
    working_dir: /app
    command: sh -c "bun install && bun run --filter '*' dev"
    init: true
    ports:
      - "5173:5173"           # Vite dev server (web)
      - "${PORT:-8787}:8787"  # API / WebSocket server
    volumes:
      - ./:/app
      - whiteboard-dev-data:/app/data
    environment:
      PORT: 8787
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      OWNER_TOKEN: ${OWNER_TOKEN:-dev-token-do-not-use-in-production}
      DATA_DIR: /app/data
      BASE_PATH: ${BASE_PATH:-/}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

volumes:
  whiteboard-dev-data:
    name: whiteboard-dev-data
