name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — no token writes anywhere in this workflow.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        # `bun audit` exits non-zero on advisories. We pin severity to
        # 'high' so a low/moderate advisory doesn't immediately fail
        # builds — Dependabot will surface those via PRs. Anything
        # high / critical blocks the merge.
        run: bun audit --audit-level=high
        continue-on-error: false

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build web
        run: bun run --filter @whiteboard/web build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright chromium
        # Browser binaries come from the cache when the lockfile is
        # unchanged; --with-deps still apt-installs the system libraries
        # the runner image lacks. On a cache hit the download is skipped.
        run: bunx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        # Builds apps/web, then drives the production bundle through the
        # real Bun static server (apps/server) — see apps/e2e/playwright.config.ts.
        run: bun run test:e2e

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: whiteboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        # v1 is stateless — no OWNER_TOKEN env needed (deferred per ADR 0012).
        run: |
          docker run --rm -d \
            -p 8787:8787 \
            --name whiteboard-ci \
            whiteboard:ci
          for i in {1..15}; do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then
              echo "Health check passed."
              break
            fi
            echo "Waiting for server... ($i/15)"
            sleep 2
          done
          curl -fsS http://localhost:8787/health
          docker stop whiteboard-ci
