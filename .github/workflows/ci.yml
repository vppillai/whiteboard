name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build web
        run: bun run --filter @whiteboard/web build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whiteboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        # v1 is stateless — no OWNER_TOKEN env needed (deferred per ADR 0012).
        run: |
          docker run --rm -d \
            -p 8787:8787 \
            --name whiteboard-ci \
            whiteboard:ci
          for i in {1..15}; do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then
              echo "Health check passed."
              break
            fi
            echo "Waiting for server... ($i/15)"
            sleep 2
          done
          curl -fsS http://localhost:8787/health
          docker stop whiteboard-ci
