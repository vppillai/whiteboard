# CodeQL static analysis. Catches common JS/TS security patterns
# without adding a runtime dependency. Free for public repos.
#
# Triggers:
#   - push to main (block regressions on merge)
#   - pull_request to main (block them BEFORE merge)
#   - weekly schedule (catch new advisory matches)
#
# Uses only static refs (no event-payload interpolation), no shell `run`
# commands. Workflow-injection surface is zero.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC. Weekly is sufficient for a single SPA at v1.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
